<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pitches</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #212121; color: #f4f4f4; font-family: Inter, Roboto, system-ui, sans-serif; font-weight: 300; }
    main { width: min(560px, calc(100vw - 32px)); }
    h1 { font-weight: 400; font-size: 1.8rem; margin: 0 0 0.3rem; }
    p { color: #b5b5b5; margin: 0 0 1.4rem; }
    a.card { display: block; color: inherit; text-decoration: none; border: 1.5px solid rgba(255,255,255,0.28); border-radius: 20px; padding: 18px 22px; margin-bottom: 10px; transition: border-color 0.2s, transform 0.3s; }
    a.card:hover { border-color: #fff; transform: translateY(-2px); }
    a.card h2 { font-weight: 400; font-size: 1.15rem; margin: 0 0 0.2rem; }
    a.card span { color: #b5b5b5; font-size: 0.92em; }
    .err { color: #ff6b6b; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</head>
<body>
  <main>
    <h1>Pitches</h1>
    <p>Listed in pitches.yaml. Each pitch is its own folder under pitches/.</p>
    <div id="list">Loading…</div>
  </main>
  <script>
    fetch('pitches.yaml', { cache: 'no-store' }).then(r => r.text()).then(t => {
      const items = jsyaml.load(t) || [];
      document.getElementById('list').innerHTML = items.map(p =>
        '<a class="card" href="pitches/' + p.folder + '/"><h2>' + p.title + '</h2>' + (p.summary ? '<span>' + p.summary + '</span>' : '') + '</a>'
      ).join('') || 'No pitches yet.';
    }).catch(() => {
      document.getElementById('list').innerHTML = '<p class="err">Could not load pitches.yaml. Serve the folder with serve.cmd instead of opening the file directly.</p>';
    });
  </script>
</body>
</html>
